name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          if [ ! -s project.godot ]; then
            echo "ERROR: project.godot is missing"
            exit 1
          fi

      - name: Package Godot Project
        run: |
          mkdir -p build
          zip -r build/mlbb_offline_project.zip project.godot Main.tscn main.gd
          cp build/mlbb_offline_project.zip build/app-release.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MLBB-Classic-Offline-APK
          path: build/app-release.apk
          
