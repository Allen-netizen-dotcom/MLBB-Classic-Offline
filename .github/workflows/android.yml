name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking Android game project..."
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort
          if [ ! -s project.godot ]; then
            echo "ERROR: project.godot is missing or empty."
            exit 1
          fi

      - name: Build status
        run: |
          echo "Project found."
          echo "Godot Android export setup is still required."
          
