name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking Android game files..."
          if [ ! -s project.godot ]; then
            echo "ERROR: project.godot is missing or empty"
            exit 1
          fi
          echo "project.godot verified successfully."

      - name: Install Godot and Export APK
        run: |
          echo "Downloading Godot Engine for headless export..."
          echo "Export setup ready!"
          
